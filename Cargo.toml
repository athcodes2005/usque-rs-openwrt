[package]
name = "usque-rs"
version = "0.2.5"
edition = "2021"
# The newest toolchain a locked dependency needs (`time` 0.3.55); clippy reads
# its MSRV from here too.
rust-version = "1.88"
description = "OpenWrt-optimized Rust MASQUE (CONNECT-IP over HTTP/3 & QUIC) client for Cloudflare WARP"
repository = "https://github.com/athcodes2005/usque-rs-openwrt"
homepage = "https://github.com/athcodes2005/usque-rs-openwrt"
keywords = ["cloudflare", "warp", "masque", "quic", "openwrt"]
categories = ["network-programming", "command-line-utilities"]
license = "MIT"

[[bin]]
name = "usque-rs"
path = "src/main.rs"

[dependencies]
quiche = "0.30"
octets = "0.3"

tokio = { version = "1", features = ["io-util", "net", "macros", "rt-multi-thread", "time"] }
mio = { version = "1", features = ["net", "os-poll"] }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ring = "0.17"
# reqwest's own "rustls" feature brings aws-lc-rs and the platform's certificate
# store. The client keeps ring and the bundled Mozilla roots (a router may have
# no CA bundle installed), so it hands reqwest a rustls config of its own.
reqwest = { version = "0.13", features = ["json", "rustls-no-provider"], default-features = false }
rustls = { version = "0.23", features = ["ring", "std", "tls12"], default-features = false }
webpki-roots = "1"
base64 = "0.23"
log = "0.4"
env_logger = "0.11"
anyhow = "1"
thiserror = "2"
chrono = { version = "0.4", features = ["serde"] }
hex = "0.4"
rcgen = "0.14"
pem = "4"
x509-parser = "0.18"
p256 = { version = "0.14", features = ["ecdsa", "pkcs8", "pem"] }
der = { version = "0.8", features = ["pem"] }
pkcs8 = { version = "0.11", features = ["pem", "std"] }
tun = { version = "0.8", features = ["async"] }
tempfile = "3"
time = "0.3"
# Software fallback for 64-bit atomics on targets without native support (e.g. armv5te)
portable-atomic = { version = "1", features = ["fallback"] }

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"
rtnetlink = "0.24"
futures = "0.3"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = "symbols"
