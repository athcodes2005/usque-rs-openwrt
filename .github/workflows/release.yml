name: Release

on:
  push:
    tags:
      - "v*.*.*"
    # A change to the dependencies or to the build setup is cross-built for
    # every target when it reaches main, without publishing anything: a target
    # that no longer builds then shows before a tag is cut. (Tag pushes ignore
    # the path filter.)
    branches:
      - main
    paths:
      - Cargo.lock
      - Cargo.toml
      - Cross.toml
      - .github/workflows/release.yml
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to build and publish again (e.g. v0.2.4)"
        required: true

# Only the publish job writes; it asks for that itself.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  CROSS_CONFIG: Cross.toml
  # A manual run builds the tag it names, not the branch it was started from.
  RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
  # What to check out: that tag, or the commit that was pushed.
  BUILD_REF: ${{ github.event.inputs.tag || github.sha }}
  # Only a tag (pushed, or named in a manual run) is published.
  PUBLISH: ${{ github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/') }}

# Third-party actions are pinned by commit: a tag can be moved to other code,
# and the publish job below holds write access to the releases the router
# installs from.
jobs:
  test:
    name: Test and verify tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.BUILD_REF }}

      - name: Verify tag matches Cargo.toml version
        if: env.PUBLISH == 'true'
        run: |
          CARGO_VERSION="$(awk '/^\[package\]/{p=1;next} /^\[/{p=0} p && /^version[[:space:]]*=/{gsub(/[" ]/,"",$0); sub(/^version=/,"",$0); print; exit}' Cargo.toml)"
          if [[ -z "$CARGO_VERSION" ]]; then
            echo "::error ::could not read package version from Cargo.toml"
            exit 1
          fi
          if [[ "${RELEASE_TAG#v}" != "$CARGO_VERSION" ]]; then
            echo "::error ::tag ${RELEASE_TAG} does not match Cargo.toml version ${CARGO_VERSION}"
            exit 1
          fi

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build perl \
            pkg-config clang libclang-dev nasm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          components: clippy

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          prefix-key: v2-portable
          shared-key: release-test

      - name: Run Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Run tests
        run: cargo test --locked

  build:
    name: Build / ${{ matrix.target }}
    needs: test
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          # ── x86_64 ──────────────────────────────────────────────────────
          - target: x86_64-unknown-linux-musl
            artifact_name: usque-rs-x86_64-linux-musl

          # ── 64-bit ARM (OpenWrt aarch64 routers) ────────────
          - target: aarch64-unknown-linux-musl
            artifact_name: usque-rs-aarch64-linux-musl

          # ── 32-bit ARM ───────────────────────────────────────────────────
          - target: armv7-unknown-linux-musleabihf
            artifact_name: usque-rs-armv7-linux-musleabihf

          - target: arm-unknown-linux-musleabi
            artifact_name: usque-rs-arm-linux-musleabi

          - target: armv5te-unknown-linux-musleabi
            artifact_name: usque-rs-armv5te-linux-musleabi

          # ── MIPS (OpenWrt routers) ────────────────────────────────────────
          - target: mipsel-unknown-linux-musl
            artifact_name: usque-rs-mipsel-linux-musl
            toolchain: nightly
            panic_strategy: unwind

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.BUILD_REF }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ matrix.toolchain || 'stable' }}

      - name: Cache Rust registry
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: release-${{ matrix.target }}

      - name: Install cross
        uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2
        with:
          tool: cross

      - name: Build (release)
        env:
          CARGO_PROFILE_RELEASE_PANIC: ${{ matrix.panic_strategy || 'abort' }}
        run: cross build --release --locked --target ${{ matrix.target }}

      - name: Strip binary
        run: |
          sudo apt-get install -y --no-install-recommends llvm 2>/dev/null || true
          if command -v llvm-strip &>/dev/null; then
            llvm-strip --strip-all target/${{ matrix.target }}/release/usque-rs
          else
            STRIP=$(ls /usr/bin/llvm-strip-* 2>/dev/null | sort -V | tail -1)
            if [[ -n "$STRIP" ]]; then
              "$STRIP" --strip-all target/${{ matrix.target }}/release/usque-rs
            else
              echo "No llvm-strip found, skipping strip step."
            fi
          fi

      # The versioned archive, and a copy under a name that stays the same
      # from release to release (the one router-script downloads).
      - name: Package archives
        run: |
          mkdir dist
          ARCHIVE="${{ matrix.artifact_name }}-${RELEASE_TAG}.tar.gz"
          STABLE_ARCHIVE="${{ matrix.artifact_name }}.tar.gz"
          tar czf "dist/$ARCHIVE" \
            -C target/${{ matrix.target }}/release \
            usque-rs
          cp "dist/$ARCHIVE" "dist/$STABLE_ARCHIVE"
          cd dist
          sha256sum "$ARCHIVE" > "${ARCHIVE}.sha256"
          sha256sum "$STABLE_ARCHIVE" > "${STABLE_ARCHIVE}.sha256"

      - name: Hand the archives to the publish job
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/*
          if-no-files-found: error
          retention-days: 3

  # One job creates the release and uploads every target. Six build jobs each
  # creating or updating it at once could race, and each held write access.
  # It runs when a target failed too, with what was built: one broken target
  # (mipsel builds on nightly) must not keep the others from being released.
  publish:
    name: Publish release
    needs: [test, build]
    if: ${{ !cancelled() && needs.test.result == 'success' && (github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')) }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Collect the built archives
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          path: dist
          merge-multiple: true

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: dist/*
          generate_release_notes: true
          fail_on_unmatched_files: true
