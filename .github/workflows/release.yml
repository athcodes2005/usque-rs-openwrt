name: Release

on:
  push:
    tags:
      - "v*.*.*"
    branches:
      - "release"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  CROSS_CONFIG: Cross.toml

jobs:
  build:
    name: Build / ${{ matrix.target }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          # ── x86_64 ──────────────────────────────────────────────────────
          - target: x86_64-unknown-linux-musl
            artifact_name: usque-rs-x86_64-linux-musl

          # ── 64-bit ARM (OpenWrt GL-MT3000 / Filogic / ARM64) ────────────
          - target: aarch64-unknown-linux-musl
            artifact_name: usque-rs-aarch64-linux-musl

          # ── 32-bit ARM ───────────────────────────────────────────────────
          - target: armv7-unknown-linux-musleabihf
            artifact_name: usque-rs-armv7-linux-musleabihf

          - target: arm-unknown-linux-musleabi
            artifact_name: usque-rs-arm-linux-musleabi

          - target: armv5te-unknown-linux-musleabi
            artifact_name: usque-rs-armv5te-linux-musleabi

          # ── MIPS (OpenWrt routers) ────────────────────────────────────────
          - target: mipsel-unknown-linux-musl
            artifact_name: usque-rs-mipsel-linux-musl
            toolchain: nightly
            panic_strategy: unwind

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain || 'stable' }}

      - name: Cache Rust registry
        uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}

      - name: Install cross
        uses: taiki-e/install-action@v2
        with:
          tool: cross

      - name: Build (release)
        env:
          CARGO_PROFILE_RELEASE_PANIC: ${{ matrix.panic_strategy || 'abort' }}
        run: cross build --release --target ${{ matrix.target }}

      - name: Strip binary
        run: |
          sudo apt-get install -y --no-install-recommends llvm 2>/dev/null || true
          if command -v llvm-strip &>/dev/null; then
            llvm-strip --strip-all target/${{ matrix.target }}/release/usque-rs
          else
            STRIP=$(ls /usr/bin/llvm-strip-* 2>/dev/null | sort -V | tail -1)
            if [[ -n "$STRIP" ]]; then
              "$STRIP" --strip-all target/${{ matrix.target }}/release/usque-rs
            else
              echo "No llvm-strip found, skipping strip step."
            fi
          fi

      - name: Package archive and stable binary asset
        id: pkg
        run: |
          ARCHIVE="${{ matrix.artifact_name }}-${{ github.ref_name }}.tar.gz"
          STABLE_ARCHIVE="${{ matrix.artifact_name }}.tar.gz"
          tar czf "$ARCHIVE" \
            -C target/${{ matrix.target }}/release \
            usque-rs
          cp "$ARCHIVE" "$STABLE_ARCHIVE"
          sha256sum "$ARCHIVE" > "${ARCHIVE}.sha256"
          sha256sum "$STABLE_ARCHIVE" > "${STABLE_ARCHIVE}.sha256"
          if [[ "${{ matrix.target }}" == "aarch64-unknown-linux-musl" ]]; then
            cp target/${{ matrix.target }}/release/usque-rs usque-rs-aarch64-linux-musl
            sha256sum usque-rs-aarch64-linux-musl > usque-rs-aarch64-linux-musl.sha256
          fi
          echo "archive=$ARCHIVE" >> "$GITHUB_OUTPUT"
          echo "stable_archive=$STABLE_ARCHIVE" >> "$GITHUB_OUTPUT"

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'latest' }}
          files: |
            ${{ steps.pkg.outputs.archive }}
            ${{ steps.pkg.outputs.archive }}.sha256
            ${{ steps.pkg.outputs.stable_archive }}
            ${{ steps.pkg.outputs.stable_archive }}.sha256
            usque-rs-aarch64-linux-musl*
          generate_release_notes: true
          fail_on_unmatched_files: false
