name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

permissions:
  contents: write

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: update repo metadata
        if: github.event_name != 'pull_request'
        run: |
          curl -fsSL -X PATCH \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}" \
            -d '{"description":"OpenWrt-optimized Rust MASQUE (CONNECT-IP over HTTP/3 & QUIC) client for Cloudflare WARP with BBR2 pacing, upload CoDel, and daemon syslog/readiness support","homepage":"https://github.com/athcodes2005/usque-rs-openwrt"}' || true
          curl -fsSL -X PUT \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/topics" \
            -d '{"names":["cloudflare","warp","masque","quic","http3","openwrt","rust","bbr2","codel"]}' || true

      - name: Check formatting
        run: cargo fmt --all --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build golang-go perl \
            pkg-config clang libclang-dev nasm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2

      - name: Check Clippy errors
        run: |
          cargo clippy --all-targets --all-features --message-format=short -- -D warnings || {
            cargo clippy --all-targets --all-features --message-format=json -- -D warnings | python3 -c '
          import json, sys
          for line in sys.stdin:
              try:
                  d = json.loads(line)
                  msg = d.get("message", {})
                  if msg.get("level") in ("error", "warning"):
                      spans = msg.get("spans", [{}])
                      s = spans[0] if spans else {}
                      print(f"::error file={s.get(\"file_name\",\"src/main.rs\")},line={s.get(\"line_start\",1)}::{msg.get(\"rendered\", msg.get(\"message\",\"\")).splitlines()[0]}")
              except Exception:
                  pass
          '
            exit 1
          }

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build golang-go perl \
            pkg-config clang libclang-dev nasm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2

      - name: Run tests
        run: cargo test --all
